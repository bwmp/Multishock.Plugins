name: Build Plugins

on:
  push:
    branches:
      - main
    paths:
      - 'Plugins/**'
      - 'Tests/**'
      - 'Shared/**'
      - 'Directory.*.props'
      - 'Directory.Build.targets'
      - 'MultiShock.Plugins.slnx'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Plugins/**'
      - 'Tests/**'
      - 'Shared/**'
      - 'Directory.*.props'
      - 'Directory.Build.targets'
      - 'MultiShock.Plugins.slnx'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MultiShock.Plugins.slnx

      - name: Build
        run: dotnet build MultiShock.Plugins.slnx -c Release --no-restore -p:PluginPackageDir=${{ github.workspace }}/artifacts

      - name: Test
        run: dotnet test MultiShock.Plugins.slnx -c Release --no-build --nologo

      - name: Upload plugin packages
        uses: actions/upload-artifact@v4
        with:
          name: msplugin-packages
          path: artifacts/*.msplugin
          if-no-files-found: error

      - name: Upload Windows-built RandomNodes for Linux testing
        uses: actions/upload-artifact@v4
        with:
          name: randomnodes-windows-package
          path: artifacts/RandomNodes.msplugin
          if-no-files-found: error

  linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Windows-built RandomNodes package
        uses: actions/download-artifact@v4
        with:
          name: randomnodes-windows-package
          path: cross-platform-fixtures

      - name: Test portable plugin code without devices
        env:
          RANDOM_NODES_WINDOWS_PACKAGE: ${{ github.workspace }}/cross-platform-fixtures/RandomNodes.msplugin
        run: dotnet test Tests/PortablePlugins.Tests/PortablePlugins.Tests.csproj -c Release --nologo -p:SkipPluginPackaging=true

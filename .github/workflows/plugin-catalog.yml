name: Publish Plugin Catalog

on:
  push:
    branches: [main]
    paths:
      - 'Plugins/**'
      - 'scripts/release-plugins.ps1'
      - '.release-please-manifest.json'
      - '.github/workflows/plugin-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure NuGet authentication
        shell: pwsh
        env:
          NUGET_USERNAME: ${{ secrets.NUGET_USERNAME }}
          NUGET_PASSWORD: ${{ secrets.NUGET_PASSWORD }}
        run: dotnet nuget update source pishock --username "$env:NUGET_USERNAME" --password "$env:NUGET_PASSWORD" --store-password-in-clear-text

      - name: Build packages and catalog
        shell: pwsh
        run: ./scripts/release-plugins.ps1

      - name: Publish installable catalog release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-catalog
          name: MultiShock Plugin Catalog
          body: |
            Installable packages consumed by MultiShock's built-in plugin repository.
            Assets are generated from the current main branch and verified by the checksums in plugin-index.json.
          make_latest: false
          prerelease: false
          files: |
            releases/*.msplugin
            releases/*.msplugin.sha256
            releases/plugin-index.json
          fail_on_unmatched_files: true

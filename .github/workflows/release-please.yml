name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.transform.outputs.matrix }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Debug release outputs
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          echo "releases_created: ${{ steps.release.outputs.releases_created }}"
          echo "paths_released: ${{ steps.release.outputs.paths_released }}"
          echo "All outputs:"
          echo '${{ toJSON(steps.release.outputs) }}'

      - name: Transform paths for matrix
        id: transform
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          echo "Raw paths: ${{ steps.release.outputs.paths_released }}"
          # Transform ["path1", "path2"] to [{"path": "path1"}, {"path": "path2"}]
          PATHS='${{ steps.release.outputs.paths_released }}'
          
          # Check if PATHS is empty or null
          if [ -z "$PATHS" ] || [ "$PATHS" = "null" ]; then
            echo "No paths to process"
            echo "matrix=[]" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          MATRIX=$(echo "$PATHS" | jq -c 'map({"path": .})')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Transformed matrix: $MATRIX"

  build-releases:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: windows-latest
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.release-please.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get plugin info
        id: plugin-info
        shell: pwsh
        run: |
          $path = "${{ matrix.plugin.path }}"
          $pluginName = Split-Path -Leaf $path
          $versions = Get-Content .release-please-manifest.json -Raw | ConvertFrom-Json
          $version = $versions.$path

          if (-not $version) {
            Write-Error "Version for '$path' was not found in .release-please-manifest.json"
            exit 1
          }

          echo "plugin_name=$pluginName" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build validated release package
        shell: pwsh
        run: ./scripts/release-plugins.ps1 -Plugin "${{ steps.plugin-info.outputs.plugin_name }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.plugin-info.outputs.plugin_name }}-v${{ steps.plugin-info.outputs.version }}
          files: |
            releases/${{ steps.plugin-info.outputs.plugin_name }}-${{ steps.plugin-info.outputs.version }}.msplugin
            releases/${{ steps.plugin-info.outputs.plugin_name }}-${{ steps.plugin-info.outputs.version }}.msplugin.sha256
          fail_on_unmatched_files: true

  publish-catalog:
    needs:
      - release-please
      - build-releases
    if: ${{ needs.release-please.outputs.releases_created == 'true' && needs.build-releases.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build installable packages and catalog
        shell: pwsh
        run: ./scripts/release-plugins.ps1

      - name: Publish installable catalog release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-catalog
          name: MultiShock Plugin Catalog
          body: |
            Installable packages consumed by MultiShock's built-in plugin repository.
            Assets are generated only after a Release Please release PR is merged.
          make_latest: false
          prerelease: false
          files: |
            releases/*.msplugin
            releases/*.msplugin.sha256
            releases/plugin-index.json
          fail_on_unmatched_files: true
